<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; padding: 0; overflow: hidden; background: #fff; }
/* Nothing remembered yet — a first load in a fresh session. The OS preference
   is the best guess available before Python has said anything, and it is right
   for the common case of a dark app on a dark desktop. */
@media (prefers-color-scheme: dark) {
    html, body { background: #0e1117; }
}
#graph { width: 100%; }
#legend {
    position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.92);
    padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #333;
    pointer-events: none; z-index: 10; line-height: 1.8;
}
#legend .row { white-space: nowrap; }
#legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 2px; }
#legend .line { display: inline-block; width: 20px; height: 2px; vertical-align: middle; margin-right: 2px; }
#legend .line.dashed { border-top: 2px dashed; height: 0; }
#legend .line.solid { border-top: 2px solid; height: 0; }
#fullscreen-btn, #download-btn, #copy-btn {
    position: absolute; top: 8px; z-index: 10;
    width: 32px; height: 32px; border: none; border-radius: 6px;
    background: rgba(255,255,255,0.92); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.7; transition: opacity 0.2s;
}
#fullscreen-btn { right: 8px; }
#download-btn { right: 48px; }
#copy-btn { right: 88px; }
#fullscreen-btn:hover, #download-btn:hover, #copy-btn:hover {
    opacity: 1;
    /* Over its neighbours while its tooltip is out: the three buttons share a
       z-index and the tip reaches back across the ones to its left, so the
       later button in the markup painted over the words. */
    z-index: 11;
}
#fullscreen-btn svg, #download-btn svg, #copy-btn svg {
    width: 18px; height: 18px; fill: #555;
    /* The button is the hover target, not the icon: a tooltip is not looked up
       from inside an <svg>, which is why the native `title` on these three
       never appeared. */
    pointer-events: none;
}
/* ...and the tooltips themselves, drawn by the page rather than left to the
   browser: they show at once instead of after a second, and they can be read
   over a busy graph. The colours are the theme's own, swapped — the text
   colour as the chip and the background as the type — which is maximum
   contrast in both themes by construction (see themeToolbarButtons). */
#fullscreen-btn::after, #download-btn::after, #copy-btn::after {
    content: attr(data-tip);
    position: absolute;
    /* Under the button, shifted left of the right-hand strip: the panel's
       reopen toggle is a Streamlit element floating over the canvas from just
       below this toolbar, outside this iframe, so it paints over anything the
       viewer draws in its 30px. 32px of offset clears it. */
    top: calc(100% + 6px);
    right: 32px;
    padding: 4px 8px;
    border-radius: 6px;
    font: 500 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    white-space: nowrap;
    background: var(--tip-bg, #333333);
    color: var(--tip-fg, #ffffff);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
}
#fullscreen-btn:hover::after, #download-btn:hover::after, #copy-btn:hover::after {
    opacity: 1;
}
/* ...and beside the button when the space under it is taken. The details panel
   is a Streamlit card floating over the canvas from just below this toolbar and
   it is outside this iframe, so a tooltip dropped underneath is not dimmed or
   clipped — it is simply not there. See placeTip(). */
#fullscreen-btn.tip-left::after,
#download-btn.tip-left::after,
#copy-btn.tip-left::after {
    top: 50%;
    right: calc(100% + 8px);
    transform: translateY(-50%);
}
/* In fullscreen the container fills the screen, so the graph doesn't fall back
   to the browser's default black backdrop. Percentages, not vw/vh: this document
   is a Streamlit component iframe, where vw/vh resolve against the *iframe's*
   viewport, so a browser window smaller than the screen left the container that
   size with black bands around it (issue #177 follow-up). 100% resolves against
   the fullscreen box the UA gives us, which is the screen. */
#container:fullscreen { width: 100%; height: 100%; }
</style>
<script>
// Paint the remembered background before the first frame.
//
// This document is replaced whenever Streamlit re-mounts the component — which
// a click on the Display options or Path finder switch is enough to do — and a
// fresh one used to paint the stylesheet's white until the theme arrived over
// the round trip from Python. Two or three frames of white, in the middle of a
// dark app, on a control people toggle constantly (issue #372).
//
// The colour is the one this component last drew, kept per session and per
// origin. This runs *after* the stylesheet above so the rule it inserts is the
// last one standing: same specificity, so document order decides, and the
// remembered colour has to beat both the white default and the dark media
// query. The stylesheet is the fallback for a first-ever load, where nothing
// is remembered yet.
(function () {
    try {
        var bg = sessionStorage.getItem('viz_theme_bg');
        // Straight into a stylesheet, so it applies to a <body> that does not
        // exist yet. Only a colour is let through: this value is written by
        // rememberThemeBg from what Python sends, and a stylesheet is not the
        // place to find out that something else got in.
        if (bg && /^(#[0-9a-fA-F]{3,8}|rgba?\([\d\s.,%/]+\))$/.test(bg)) {
            var early = document.createElement('style');
            early.textContent = 'html, body { background: ' + bg + '; }';
            document.head.appendChild(early);
        }
    } catch (e) {}   // private mode, or storage blocked: fall through to the CSS
})();
</script>
</head>
<body>
<div id="container" style="position: relative;">
    <div id="graph"></div>
    <div id="legend"></div>
    <button id="fullscreen-btn" data-tip="Fullscreen" aria-label="Fullscreen" style="display:none;" onclick="toggleFullscreen()">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
    <button id="download-btn" data-tip="Download as PNG" aria-label="Download as PNG" style="display:none;" onclick="downloadGraph()">
        <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v6h3.66V9h3.84L12 2z" transform="rotate(180 12 12)"/></svg>
    </button>
    <button id="copy-btn" data-tip="Copy what is selected" aria-label="Copy what is selected" style="display:none;" onclick="copySelection()">
        <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
    </button>
</div>
<script>
// Streamlit component communication
function sendToStreamlit(type, data) {
    window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data || {}), "*");
}

// The canvas buttons all sit on the theme's panel colour with its text colour,
// and both render paths have to paint them — a re-theme and a rebuild.
function themeToolbarButtons(theme) {
    ['fullscreen-btn', 'download-btn', 'copy-btn'].forEach(function (id) {
        var btn = document.getElementById(id);
        if (!btn) return;
        btn.style.background = theme.panel;
        var svg = btn.querySelector('svg');
        if (svg) svg.style.fill = theme.text;
    });
    // The tooltip chip: the theme's colours the other way round, so it reads
    // over the canvas whichever theme is on.
    var root = document.documentElement;
    root.style.setProperty('--tip-bg', theme.text);
    root.style.setProperty('--tip-fg', theme.bg);
}

// What a toolbar button says on hover. The tooltip is drawn from data-tip (see
// the CSS); aria-label carries the same words for anyone not hovering at all.
function setButtonTip(btn, text) {
    if (!btn) return;
    btn.setAttribute('data-tip', text);
    btn.setAttribute('aria-label', text);
}

// Where the tooltip goes: under the button, or beside it when the app has
// something parked under it. Everything the graph page floats over the canvas —
// the details panel, its reopen toggle, the Node options card — is Streamlit's
// DOM in the parent, which always paints over this iframe, so a tip underneath
// one of them is invisible rather than merely dimmed. The page is same-origin,
// so ask it what is at the spot and step aside when the answer isn't us.
function placeTip(btn) {
    var flip = false;
    try {
        var fe = window.frameElement;
        var d = parentDoc();
        if (fe && d && d.elementFromPoint) {
            var fr = fe.getBoundingClientRect();
            var r = btn.getBoundingClientRect();
            flip = d.elementFromPoint(fr.left + r.right - 40, fr.top + r.bottom + 12) !== fe;
        }
    } catch (e) {}   // cross-origin: leave it under the button
    btn.classList.toggle('tip-left', flip);
}

['fullscreen-btn', 'download-btn', 'copy-btn'].forEach(function (id) {
    var btn = document.getElementById(id);
    if (btn) btn.addEventListener('mouseenter', function () { placeTip(btn); });
});

// --- Copy what is selected (issue #312) ------------------------------------
// The bar under the graph cuts its line to fit and a node's own label is cut to
// fit the node, so neither can be read in full, let alone copied — and an
// annotation's value is usually the one thing worth copying. The button on the
// canvas hands over the whole thing, tooltip lines and all, whichever panel is
// open. It appears with a selection and goes with it.
var COPY_TITLE = 'Copy what is selected';
var COPY_ICON = '<path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>';
var DONE_ICON = '<path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>';
var copyText = '';

// What a selection copies: what it is called, in full — a node draws a label cut
// to fit it, and flabel carries the whole one. Just that: the tooltip repeats the
// name and adds a sentence about it, which is worth reading on screen and not
// worth pasting.
function selectionText(d) {
    return d ? String(d.flabel || d.label || '') : '';
}

function setCopyTarget(text) {
    copyText = text || '';
    var btn = document.getElementById('copy-btn');
    if (btn) btn.style.display = copyText ? 'flex' : 'none';
}

// The async clipboard needs a secure context and a permission the desktop
// webview does not grant, so the old selection-based copy stays as the fallback
// rather than the button doing nothing there.
function legacyCopy(text) {
    try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
    } catch (e) {
        return false;
    }
}

function flashCopied(ok) {
    var btn = document.getElementById('copy-btn');
    if (!btn) return;
    var svg = btn.querySelector('svg');
    if (svg) svg.innerHTML = ok ? DONE_ICON : COPY_ICON;
    setButtonTip(btn, ok ? 'Copied' : 'Could not copy — select the text instead');
    setTimeout(function () {
        var s2 = btn.querySelector('svg');
        if (s2) s2.innerHTML = COPY_ICON;
        setButtonTip(btn, COPY_TITLE);
    }, 1400);
}

function copySelection() {
    if (!copyText) return;
    var text = copyText;
    try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(
                function () { flashCopied(true); },
                function () { flashCopied(legacyCopy(text)); }
            );
            return;
        }
    } catch (e) { /* no async clipboard here: fall through */ }
    flashCopied(legacyCopy(text));
}

// Close the Node options card when something in the graph is selected. The card
// floats over the top of the canvas, so a click means the user has moved on to
// the graph itself and the card is now in the way — the details panel beside it
// is where the click's answer appears. Closed the way the user would close it,
// by clicking the expander's own summary, so Streamlit's state follows and the
// card does not spring back open on the next rerun. The parent document is the
// same origin (see measureReserve); if it ever is not, the card simply stays.
function closeNodeOptions() {
    try {
        var summary = window.parent.document.querySelector(
            '.st-key-viz_filter_nodes details[open] > summary');
        if (summary) summary.click();
    } catch (e) { /* cross-origin: leave the card as it is */ }
}

// What Streamlit is told about a selected node. flabel is the untruncated label
// for nodes whose drawn one is cut to fit (annotation values, literals); the
// details panel and the copy button both want that one.
function selectionPayload(id, nd) {
    return {
        nodeId: id,
        ntype: nd.ntype || null,
        ename: nd.ename || null,
        label: nd.label,
        flabel: nd.flabel || null,
        title: nd.title || '',
        selected: true
    };
}

// Report a Find-selected node to Streamlit, matching the selectNode payload, so
// the details/status panel reflects the found node. selectNodes() alone does not
// fire selectNode, so a Find focus would otherwise leave the panel out of sync
// with the highlighted node (PR #144 review P2).
function sendFindSelection(id) {
    try {
        var ds = network && network.body && network.body.data && network.body.data.nodes;
        var nd = ds && ds.get(id);
        if (nd) {
            setCopyTarget(selectionText(nd));
            sendToStreamlit("streamlit:setComponentValue", {value: selectionPayload(id, nd)});
        }
    } catch (e) {}
}

var visLoaded = false;
var pendingArgs = null;
var network = null;
var autofitOn = false;
var webDownload = true;  // browser download works on the web; on desktop we save via Python
var lastSeq = null;
var lastNodes = null;
var lastEdges = null;
var currentTheme = {bg: '#ffffff', panel: 'rgba(255,255,255,0.92)', text: '#333333'};
var currentHeight = 600;  // last non-fullscreen graph height, restored on exit
var fsRestoreView = null;  // viewport captured just before a fullscreen toggle
var FS_ZOOM_OUT = 0.70;    // entering fullscreen zooms out ~30% around the centre
var fsGen = 0;             // fullscreen transition counter, to void stale callbacks
var fsResizeHandler = null; // active 'resize' listener from the current transition
var fsDetachTimer = null;   // timer that detaches fsResizeHandler

// Fill the available window height. Reads the parent window's height and this
// iframe's position in it (same-origin), reserving room for whatever sits below.
// This is how the canvas is always sized; args.height is only the fallback for
// when the parent window cannot be read at all.
//
// That reserve used to be a flat 90px, which is what the status bar takes when
// something is selected. With nothing selected the bar is a single line, so the
// graph stopped ~80px short of the bottom for no reason. It is measured instead,
// by adding up what actually follows the graph.
//
// Only the graph's *own* column counts. Measuring to the bottom of the whole
// page block took the details panel beside the graph with it — a tall panel then
// read as "space below the graph", and the canvas collapsed to its 300px floor
// with the panel's height of emptiness underneath it. The siblings' heights do
// not change when the graph is resized, so the two cannot chase each other.
var AUTOFIT_MAX_RESERVE = 220;

// The status bar is sticky, so it stays readable while the page scrolls. A
// pinned sticky element's rect reports where it is *painted*, though, not where
// it sits in the layout — and once pinned that is level with the window bottom,
// above the graph's own edge, so the measurement below reserved nothing and the
// canvas grew until the bar covered it. Un-pin it for the length of the
// measurement: it all happens in one task, so nothing repaints in between.
function unpinStickies() {
    var undo = [];
    try {
        var doc = window.parent.document;
        var el = doc.getElementById('graph-status-bar');
        for (; el && el !== doc.body; el = el.parentElement) {
            if (window.parent.getComputedStyle(el).position !== 'sticky') continue;
            undo.push([el, el.style.getPropertyValue('position'),
                       el.style.getPropertyPriority('position')]);
            el.style.setProperty('position', 'static', 'important');
        }
    } catch (e) { /* cross-origin, or no bar on screen: nothing to un-pin */ }
    return function () {
        for (var i = 0; i < undo.length; i++) {
            if (undo[i][1]) {
                undo[i][0].style.setProperty('position', undo[i][1], undo[i][2]);
            } else {
                undo[i][0].style.removeProperty('position');
            }
        }
    };
}

function autofitReserve() {
    var repin = unpinStickies();
    try {
        return measureReserve();
    } finally {
        repin();
    }
}

function measureReserve() {
    var node = window.frameElement;
    while (node && node.getAttribute
           && node.getAttribute('data-testid') !== 'stElementContainer') {
        node = node.parentElement;
    }
    if (!node || !node.parentElement) return 90;
    // The lowest edge of anything below, not the sum of their heights: that way
    // the gaps and padding between them are included without having to know
    // which of Streamlit's blocks contributes what.
    var bottom = window.frameElement.getBoundingClientRect().bottom;
    var lowest = bottom;
    while (node && node.parentElement) {
        var parent = node.parentElement;
        var ptid = parent.getAttribute && parent.getAttribute('data-testid');
        // Climb, because the status bar is not the graph's sibling: it sits a
        // level up, after the whole row of columns. Skip the row itself, where
        // the following sibling is the details panel *beside* the graph — taking
        // that for "below" collapsed the canvas to its floor.
        if (ptid !== 'stHorizontalBlock') {
            for (var sib = node.nextElementSibling; sib; sib = sib.nextElementSibling) {
                var r = sib.getBoundingClientRect();
                if (r.height > 0 && r.bottom > lowest) lowest = r.bottom;
                // Descendants too: the status bar is a fixed-height div inside a
                // shorter markdown container, so the container's own edge sits
                // 16px above the bar it holds and the bar hung off the window.
                var kids = sib.querySelectorAll('*');
                if (kids.length && kids.length < 60) {
                    for (var i = 0; i < kids.length; i++) {
                        var kr = kids[i].getBoundingClientRect();
                        if (kr.height > 0 && kr.bottom > lowest) lowest = kr.bottom;
                    }
                }
            }
        }
        if (ptid === 'stMainBlockContainer') break;
        node = parent;
    }
    return Math.min(lowest - bottom, AUTOFIT_MAX_RESERVE);
}

// The page's own viewport, which while the page is fullscreen is the screen.
// Read from the parent's root element as well as from innerHeight: this document
// is a component iframe, and a fullscreen page does not resize it, so its own
// window.innerHeight says nothing about the box the canvas has to fill (issue
// #177 follow-up). The larger of the two is the page's current viewport in both
// states — out of fullscreen they agree, bar a scrollbar.
function viewportHeight() {
    var d = parentDoc();
    var client = (d && d.documentElement && d.documentElement.clientHeight) || 0;
    return Math.max(client, window.parent.innerHeight || 0);
}

function autofitHeight() {
    try {
        var fe = window.frameElement;
        if (!fe) return null;
        var rect = fe.getBoundingClientRect();
        var avail = viewportHeight() - rect.top - autofitReserve() - 8;
        return Math.max(Math.round(avail), 300);
    } catch (e) {
        return null;  // cross-origin or unavailable: fall back to fixed height
    }
}

function applyHeight(h) {
    document.getElementById('graph').style.height = h + 'px';
    sendToStreamlit("streamlit:setFrameHeight", {height: h});
}

// --- Neighbour highlight (issue #224) ---------------------------------------
// Selecting a node rings the nodes at the other end of its edges. vis already
// styles the clicked node and thickens its connected edges, but leaves those
// neighbours looking like every other node, so "what does this class actually
// link to?" stays hard to answer on a large ontology — which is what the focus
// mode was being over-used for.
//
// Direction is carried by the border *dash*, not by a colour: the fills already
// spend the palette on entity type (green class, purple object property, orange
// individual, brown annotation, teal data property, two blue-greys), and a red
// ring at width 3 already means "has validation issues". The ring colour is the
// theme's text colour, which is maximum-contrast against its own background by
// construction and reads against every mid-luminance fill in that palette, so it
// works in light and dark without the node colours having to change.
var HL_WIDTH = 2;             // 3 stays reserved for the validation-issue ring
var HL_DASH = [6, 4];         // incoming; outgoing stays solid
var hlSource = null;          // node whose neighbourhood is currently ringed
var hlSaved = null;           // id -> styling we overwrote, for an exact restore
var hlJustSelected = false;   // this tap changed the selection (see the click handler)

// Restore every ringed node to exactly what it looked like before.
//
// The saved values are written back explicitly rather than by passing the
// originals straight through: a DataSet update ignores an undefined field, so a
// node that never carried `borderWidth` or `shapeProperties` (only classes and
// individuals set the former, and Python never sets the latter) would silently
// keep the ring. The fallbacks are vis's own defaults for those two options.
function clearNeighbourHighlight() {
    var ds = network && network.body && network.body.data && network.body.data.nodes;
    if (ds && hlSaved) {
        var undo = [];
        for (var id in hlSaved) {
            if (!Object.prototype.hasOwnProperty.call(hlSaved, id)) continue;
            if (!ds.get(id)) continue;  // node has since left the graph
            var s = hlSaved[id];
            undo.push({
                id: id,
                color: s.color,
                borderWidth: s.borderWidth === undefined ? 1 : s.borderWidth,
                shapeProperties: s.shapeProperties === undefined
                    ? {borderDashes: false} : s.shapeProperties
            });
        }
        if (undo.length) { try { ds.update(undo); } catch (e) {} }
    }
    hlSource = null;
    hlSaved = null;
}

// Ring `id`'s neighbours: dashed for the ones pointing at it, solid for the ones
// it points at. A node on both sides of the relation ends up solid, because the
// outgoing pass is applied second.
function applyNeighbourHighlight(id) {
    clearNeighbourHighlight();
    var ds = network && network.body && network.body.data && network.body.data.nodes;
    if (!ds || id === null || id === undefined || !ds.get(id)) return;
    var incoming = [], outgoing = [];
    try {
        incoming = network.getConnectedNodes(id, 'from') || [];
        outgoing = network.getConnectedNodes(id, 'to') || [];
    } catch (e) { return; }

    var ring = (currentTheme && currentTheme.text) || '#333333';
    hlSource = id;
    hlSaved = {};
    var updates = [];

    function ringNode(nid, dashed) {
        if (nid === id) return;                 // self-loop: the source is not its own neighbour
        var nd = ds.get(nid);
        if (!nd) return;
        if (!Object.prototype.hasOwnProperty.call(hlSaved, nid)) {
            hlSaved[nid] = {
                color: nd.color,
                borderWidth: nd.borderWidth,
                shapeProperties: nd.shapeProperties
            };
        }
        // Keep the fill (it encodes the entity type) and override only the
        // border, for the selected and unselected states alike — the neighbour
        // itself is not selected, but a restore-selection rebuild can make it so.
        var base = (nd.color && typeof nd.color === 'object') ? nd.color : {};
        var color = Object.assign({}, base, {border: ring});
        color.highlight = Object.assign({}, base.highlight, {border: ring});
        updates.push({
            id: nid,
            color: color,
            borderWidth: HL_WIDTH,
            shapeProperties: {borderDashes: dashed ? HL_DASH : false}
        });
    }

    incoming.forEach(function(nid) { ringNode(nid, true); });
    outgoing.forEach(function(nid) { ringNode(nid, false); });
    if (updates.length) { try { ds.update(updates); } catch (e) {} }
}

// --- Shortest-path ring (issues #176, #357) ---------------------------------
// A link on a highlighted path keeps its own colour — that colour says which
// kind of link it is, and it is what the graph is scanned by — and is ringed in
// the highlight colour instead, the way the path's nodes keep their fill and
// take a coloured border. vis has no edge equivalent of a border, so the ring is
// drawn here: a wider line in the highlight colour, stroked along the same curve
// before vis draws anything, so the edge itself lands on top of it and only the
// ring shows either side of it. Python marks the edges (`pathhl`).
var RING_STEPS = 24;   // segments per link: enough to follow a curve smoothly

// The points along the curve vis is drawing `edge` as. Falls back to the
// straight line between its endpoints if this build has no getPoint: a ring that
// misses a bend is still better than a link on the path left unmarked.
function pathRingPoints(edge) {
    var pts = [], i, p;
    if (edge.edgeType && typeof edge.edgeType.getPoint === 'function') {
        for (i = 0; i <= RING_STEPS; i++) {

        // so the graph doesn't jump (issue #141). Existing nodes are pinned for
        // the stabilization pass, then released so they stay draggable.
        savedView = _raw.view || null;  // hold the camera steady too
        nodeArr.forEach(function(n) {
            if (_raw.pos[n.id]) {
                n.x = _raw.pos[n.id].x; n.y = _raw.pos[n.id].y;
                n.fixed = { x: true, y: true };
                pinnedIds.push(n.id);
            }
        });
        // Nothing went away, so everything the camera was framing is still
        // there, pinned where it was: keep the view instead of letting vis
        // re-frame the whole graph once physics settles. Adding a subclass to
        // the class you are looking at otherwise zoomed out to the whole
        // ontology every time, which is the one thing you were not looking at
        // (issue #314). When nodes *did* go away the old frame can hold nothing
        // at all — a filter swapped for another set places every node afresh —
        // so there vis still re-frames.
        // A rename is a substitution, not a change of subject: this is the graph
        // you were already looking at, with one entity under a new name. The
        // renamed node's own position was carried across above, but everything
        // else keyed off its URI — its annotation nodes — comes back under new
        // ids too, which fails that same test and re-frames the graph regardless
        // (issue #329). So a render that carried a rename holds the camera on
        // what it was framing and lets physics settle the re-keyed nodes around
        // their pinned subject.
        var _keptAll = Object.keys(_raw.pos).length === pinnedIds.length;
        var _hold = !!savedView && (_keptAll || _carried);
        var iters2 = Math.min(Math.max(nCount * 3, 150), 500);
        options.physics.stabilization = { enabled: true, iterations: Math.max(iters2 - 40, 80), updateInterval: 50, fit: !_pin && !_hold };
    } else {
        // Fresh layout (Render, or nothing cached): deterministic thanks to the
        // pinned randomSeed set in Python (issue #141).
        var iters = Math.min(Math.max(nCount * 3, 150), 500);
        var batchIters = Math.max(iters - 40, 80);
        options.physics.stabilization = { enabled: true, iterations: batchIters, updateInterval: 50, fit: !_pin };
    }
    var nodes = new vis.DataSet(nodeArr);
    network = new vis.Network(el, {nodes: nodes, edges: edges}, options);
    // Fresh DataSet: whatever the previous network had ringed is gone with it,
    // so drop the bookkeeping rather than letting it undo styling on new nodes.
    hlSource = null;
    hlSaved = null;
    hlJustSelected = false;
    // Ring the links on a highlighted shortest path (issue #357). The DataSet
    // assigns the ids vis keys its own edge objects by, so the ids have to be
    // read back off it here, after the network has been handed the set.
    var pathRings = [];
    edges.forEach(function(e) {
        if (!e || !e.pathhl || !e.pathhl.color || !e.pathhl.border) return;
        pathRings.push({
            id: e.id, color: e.pathhl.color, border: e.pathhl.border,
            width: e.width || 1   // vis's default edge width, which Python leaves unset
        });
    });
    if (pathRings.length) {
        network.on('beforeDrawing', function(ctx) { drawPathRings(ctx, pathRings); });
    }
    document.getElementById('download-btn').style.display = 'flex';
    // Only offer fullscreen where there is a page to fullscreen.
    if (fullscreenSupported()) {
        document.getElementById('fullscreen-btn').style.display = 'flex';
        // A re-mount lands in a document that knows nothing, while the page may
        // still be fullscreen: take the state from the page, and take over the
        // hooks the last document owned.
        syncFullscreenState();
    }
    // Restore selection + viewport after a genuine re-mount (e.g. the panel
    // toggled), so the node stays highlighted and the zoom/pan don't reset —
    // making the rebuild invisible. selectNodes() does not fire selectNode, so
    // this doesn't loop back to Streamlit. Python's value is authoritative in
    // both states now: a selection made while fullscreen reaches it like any
    // other (issue #381).
    var restoreNode = args.selected_node;
    // A node comes back by id and the rest is read off it; an edge has no id to
    // come back by, so Python hands its copy text over instead.
    setCopyTarget(restoreNode !== null && restoreNode !== undefined
        ? selectionText(nodes.get(restoreNode)) : (args.copy_text || ''));
    if (restoreNode !== null && restoreNode !== undefined) {
        try { network.selectNodes([restoreNode]); } catch (e) {}
        applyNeighbourHighlight(restoreNode);
    }
    // --- Find & centre (issue #144) ---------------------------------------
    // Python sends focus_node (the entity picked in "Find entity", present on
    // every render while it stays picked) and focus_seq (bumps only on a fresh
    // pick). The component iframe can re-mount between renders and renderGraph
    // rebuilds the whole network each render, so window state isn't reliable —
    // we keep the find state in sessionStorage like the viewport cache above.
    // While a pick is active we "pin" the camera on the node and keep it
    // selected across rebuilds instead of restoring the (now stale) saved
    // viewport; the pin is released the moment the user clicks or drags, so we
    // never fight them, and a fresh pick (new seq) re-arms it. _find and _pin
    // are resolved further up, before the physics options are built.
    //
    // Hold the camera on the pinned node across this rebuild instead of
    // restoring the (now stale) saved viewport; otherwise use the saved view.
    if (savedView && !_pin) {
        try { network.moveTo({scale: savedView.scale, position: savedView.position}); } catch (e) {}
    }
    if (_pin) {
        var _findFresh = !_find.centred;
        try { network.selectNodes([_pin]); } catch (e) {}
        applyNeighbourHighlight(_pin);
        // Centre now only when the layout is already final. When physics still
        // has to run, the node is still moving, so centring on its current
        // position would land in the wrong place — the stabilization handler
        // below does it once the nodes have settled (issue #195).
        if (usedSaved) {
            try {
                network.focus(_pin, {
                    scale: 1.1,
                    animation: _find.centred ? false : {duration: 700, easingFunction: 'easeInOutQuad'}
                });
            } catch (e) {}
        }
        if (_findFresh) sendFindSelection(_pin);
        _find.centred = true;
    }
    try { sessionStorage.setItem('viz_find', JSON.stringify(_find)); } catch (e) {}
    // Release the pin the moment the user takes control (click or drag), so we
    // never fight their navigation; a fresh Find pick (new seq) re-arms it.
    function _releaseFindPin() {
        try {
            var f = JSON.parse(sessionStorage.getItem('viz_find') || '{}') || {};
            f.released = true;
            sessionStorage.setItem('viz_find', JSON.stringify(f));
        } catch (e) {}
    }
    network.on('dragStart', _releaseFindPin);
    network.on('click', _releaseFindPin);
    // Is this render's pin still the live one? Deferred centring (below) runs a
    // second or more after the render, by which time the user may have taken
    // control or picked something else, so it has to re-read the shared state
    // instead of trusting the pin captured at render time.
    function _findPinLive() {
        var f = {};
        try { f = JSON.parse(sessionStorage.getItem('viz_find') || '{}') || {}; } catch (e) {}
        return !f.released && f.seq === args.focus_seq;
    }
    // Cache the layout AND viewport so re-mounts restore both instantly. Save
    // after the settle animation has frozen (not on stabilizationIterationsDone,
    // which fires ~500ms before the freeze while nodes still move), and after any
    // user drag/zoom, so the cache matches what's on screen (Codex review #84).
    function savePositions() {
        try {
            sessionStorage.setItem('viz_pos', JSON.stringify({
                seq: args.seq, hash: nodeHash, pos: network.getPositions(),
                view: {scale: network.getScale(), position: network.getViewPosition()}
            }));
        } catch (e) {}
    }
    var saveTimer = null;
    function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(savePositions, 400);
    }
    network.on('dragEnd', scheduleSave);
    network.on('zoom', scheduleSave);
    if (!usedSaved) {
        network.once('stabilizationIterationsDone', function() {
            setTimeout(function() {
                network.setOptions({ physics: { enabled: false } });
                // Release the frozen-existing pins now that physics is off (so
                // they won't move), keeping those nodes draggable (issue #141).
                if (pinnedIds.length) {
                    try {
                        nodes.update(pinnedIds.map(function(id) {
                            return { id: id, fixed: false };
                        }));
                    } catch (e) {}
                }
                // The nodes have settled and vis's auto-fit was suppressed for
                // this pass, so this is the point at which the Find pick can be
                // centred accurately (issue #195). Re-read the pin rather than
                // trusting the one captured at render time: the user may have
                // clicked or dragged while physics was still running, and
                // centring now would yank the camera back off whatever they
                // just navigated to. Cache the viewport only once the camera
                // animation has finished, or we'd store a mid-flight frame.
                if (_pin && _findPinLive()) {
                    try {
                        network.focus(_pin, {
                            scale: 1.1,
                            animation: {duration: 600, easingFunction: 'easeInOutQuad'}
                        });
                    } catch (e) {}
                    setTimeout(savePositions, 700);
                } else {
                    savePositions();
                }
            }, 500);
        });
    }

    // Build dynamic legend from actual nodes and edges
    var nodeColors = {};
    nodes.forEach(function(n) {
        var bg = n.color && (typeof n.color === 'string' ? n.color : n.color.background);
        if (!bg) return;
        var key = bg.toUpperCase();
        if (!nodeColors[key]) nodeColors[key] = true;
    });
    var edgeColors = {};
    edges.forEach(function(e) {
        var c = typeof e.color === 'string' ? e.color : (e.color && e.color.color) || '';
        var lbl = (e.label || '').toLowerCase();
        if (c) edgeColors[c.toUpperCase() + '|' + lbl] = true;
        // A link on the highlighted path is ringed rather than repainted, so it
        // is counted under its own kind above and the ring has to be counted
        // here for "shortest path" to earn its entry (issues #176, #357).
        if (e.pathhl && e.pathhl.color) edgeColors[e.pathhl.color.toUpperCase() + '|' + lbl] = true;
    });

    var nodeItems = [
        {color: '#4CAF50', label: 'Classes'},
        {color: '#2196F3', label: 'Obj Props'},
        {color: '#9C27B0', label: 'Data Props'},
        {color: '#FF9800', label: 'Individuals'},
        {color: '#795548', label: 'Annotations'},
        {color: '#00897B', label: 'SKOS'},
        {color: '#90A4AE', label: 'Triples'}
    ];
    var edgeItems = [
        {color: '#81C784', label: 'subClassOf', match: 'subclassof', dashed: false},
        {color: '#2196F3', label: 'Object Prop', match: null, dashed: false},
        {color: '#CE93D8', label: 'Data Prop', match: null, dashed: true},
        {color: '#FFB74D', label: 'type', match: 'type', dashed: false},
        {color: '#9C27B0', label: 'equivalent', match: 'equivalentclass', dashed: false},
        {color: '#F44336', label: 'disjoint', match: 'disjointwith', dashed: false},
        {color: '#A1887F', label: 'annotation', match: null, dashed: true},
        {color: '#26A69A', label: 'broader', match: 'broader', dashed: false},
        {color: '#80CBC4', label: 'related', match: 'related', dashed: true},
        {color: '#90A4AE', label: 'triple', match: null, dashed: false},
        {color: '#FFEB3B', label: 'shortest path', match: null, dashed: false}
    ];

    var nodeLegend = '';
    nodeItems.forEach(function(item) {
        if (nodeColors[item.color.toUpperCase()]) {
            nodeLegend += '<span class="dot" style="background:' + item.color + ';"></span> ' + item.label + '  ';
        }
    });
    var edgeLegend = '';
    edgeItems.forEach(function(item) {
        var found = false;
        var uc = item.color.toUpperCase();
        for (var k in edgeColors) {
            if (k.indexOf(uc) === 0) { found = true; break; }
        }
        if (found) {
            var cls = item.dashed ? 'line dashed' : 'line solid';
            edgeLegend += '<span class="' + cls + '" style="border-color:' + item.color + ';"></span> ' + item.label + ' &nbsp;';
        }
    });

    var legendEl = document.getElementById('legend');
    legendEl.style.background = theme.panel;
    legendEl.style.color = theme.text;
    if (nodeLegend || edgeLegend) {
        legendEl.innerHTML = (nodeLegend ? '<div class="row">' + nodeLegend + '</div>' : '') +
                             (edgeLegend ? '<div class="row">' + edgeLegend + '</div>' : '');
        legendEl.style.display = '';
    } else {
        legendEl.style.display = 'none';
    }

    network.on('selectNode', function(params) {
        var nd = nodes.get(params.nodes[0]);
        hlJustSelected = true;
        setCopyTarget(selectionText(nd));
        closeNodeOptions();
        applyNeighbourHighlight(params.nodes[0]);
        sendSelection(selectionPayload(params.nodes[0], nd));
    });
    network.on('selectEdge', function(params) {
        if (params.nodes.length === 0 && params.edges.length > 0) {
            // An edge-only selection means no node is selected, and vis does not
            // fire deselectNode on the way there.
            closeNodeOptions();
            clearNeighbourHighlight();
            var ed = edges.get(params.edges[0]);
            setCopyTarget(selectionText(ed));
            sendSelection({ntype: ed.ntype || null, ename: ed.ename || null, label: ed.label || '', title: ed.title || '', selected: true, isEdge: true});
        }
    });
    network.on('deselectNode', function() {
        clearNeighbourHighlight();
        setCopyTarget('');
        sendSelection({selected: false});
    });
    network.on('deselectEdge', function() {
        setCopyTarget('');
        sendSelection({selected: false});
    });

    // Ctrl/Cmd-click a node to add it to the "Focus on one node" selection, so
    // the graph narrows to that node's neighbourhood without typing its name
    // into the focus picker (issue #56). Alt-click focuses on that node alone,
    // replacing whatever was focused before: hopping from one node to the next
    // otherwise means emptying the picker by hand between hops (issue #276).
    // Alt is checked first so it still means "only this one" when a stray
    // Ctrl or Cmd is held with it. reqId makes each request distinct so the
    // Python side applies it once. Sent after the normal selectNode value, so
    // this is the value Streamlit keeps for this interaction.
    network.on('click', function(params) {
        var wasFresh = hlJustSelected;
        hlJustSelected = false;
        if (!params.nodes.length) return;
        var ev = params.event && params.event.srcEvent;
        if (ev && (ev.altKey || ev.ctrlKey || ev.metaKey)) {
            // The focus request is the value Streamlit keeps, so it carries the
            // selection with it: on its own it left the panel, and the copy
            // button, reporting whatever was picked before this click — which
            // the rebuild then restored over the node just clicked.
            var mnd = nodes.get(params.nodes[0]);
            setCopyTarget(selectionText(mnd));
            sendToStreamlit("streamlit:setComponentValue", {
                value: Object.assign(selectionPayload(params.nodes[0], mnd), {
                    focusRequest: true,
                    reqId: Date.now(),
                    replace: !!ev.altKey
                })
            });
            return;
        }
        // Clicking the already-selected node again clears it, so the ring can be
        // dismissed on the node that raised it instead of having to find empty
        // canvas to click. vis emits selectNode only when the selection actually
        // changes, so no event fires on that second click — hlJustSelected tells
        // the two clicks apart, and vis's own unselectAll() is silent too, so the
        // deselect has to be published here.
        if (!wasFresh && params.nodes[0] === hlSource) {
            clearNeighbourHighlight();
            setCopyTarget('');
            try { network.unselectAll(); } catch (e) {}
            try { network.redraw(); } catch (e) {}
            sendSelection({selected: false});
        }
    });
}

window.addEventListener("message", function(event) {
    if (event.data.type === "streamlit:render") {
        renderGraph(event.data.args);
    }
});

sendToStreamlit("streamlit:componentReady", {apiVersion: 1});

// Load vis-network dynamically
var script = document.createElement('script');
script.onload = function() {
    visLoaded = true;
    if (pendingArgs) { renderGraph(pendingArgs); pendingArgs = null; }
};
script.src = "vis-network.min.js";
document.head.appendChild(script);
</script>
</body>
</html>
