[theme]
primaryColor = "#0D2B7A"

[server]
# Maximum upload size in MB for the Import page file uploader.
# Streamlit's default is 200. Raise this to import larger ontologies — but
# note that parsing happens in memory, so the practical ceiling is the host's
# available RAM (the hosted demo on Streamlit Community Cloud is RAM-limited).
maxUploadSize = 200

[runner]
# Off, so a click waits for the running script's next Streamlit call instead
# of starting the next run beside it: the app edits the ontology in session
# state in place, and two runs at once race on it. Kept in step with
# STREAMLIT_OPTIONS in orionbelt_ontology_builder/local_store.py, which the
# console and desktop launchers pass.
fastReruns = false
