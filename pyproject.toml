[project]
name = "orionbelt-ontology-builder"
version = "1.27.0"
description = "A Streamlit application for building, editing, and managing OWL ontologies"
readme = "README.md"
# SPDX. Business Source License 1.1 is BUSL-1.1; BSL-1.0 is the Boost Software
# License and BSL-1.1 is not an SPDX identifier at all, so the old value named
# nothing while looking like it named Boost.
license = "BUSL-1.1"
# PEP 639. Both reach the wheel as dist-info/licenses/, which is where a consumer
# of the built artifact looks. MANIFEST.in governs the sdist only, so listing the
# notices there alone left the wheel without them, and the licence texts inside
# the package pointing at a file that was not in it.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{name = "Ralf Becher, RALFORION d.o.o.", email = "info@ralforion.com"}]
keywords = ["ontology", "owl", "rdf", "rdflib", "streamlit", "semantic-web", "knowledge-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit==1.62.0",
    "rdflib>=7.0.0",
    "owlrl>=6.0.2",
    "networkx>=3.0",
    "streamlit-local-storage>=0.0.25",
    "streamlit-ace>=0.1.1",
]

[project.scripts]
orionbelt-ontology-builder = "orionbelt_ontology_builder.cli:run"
orionbelt-ontology-builder-desktop = "orionbelt_ontology_builder.desktop:run"

[project.optional-dependencies]
desktop = [
    "streamlit-desktop-app>=0.3.3",
    # pywebview needs a native GUI/web-rendering backend at runtime. macOS
    # bundles one (Cocoa/WebKit via pywebview's pyobjc deps), but on Linux and
    # Windows none ships by default, so the desktop launcher fails without an
    # explicit backend. pywebview's Qt backend loads through qtpy, so PySide6
    # alone is not enough; pulling pywebview's own pyside6 extra installs both
    # qtpy and PySide6 (Qt + QtWebEngine), the combination it expects.
    "pywebview[pyside6]; sys_platform != 'darwin'",
    # Detect the OS light/dark appearance for the "follow system" theme mode.
    # The embedded webview does not report the system colour scheme reliably, so
    # we read it from the OS directly.
    "darkdetect>=0.8.0",
]
# Explicit Qt backend, identical to `desktop`. PySide6 is the LGPL Qt for
# Python; we deliberately use pywebview's `pyside6` extra rather than its `qt`
# extra (which would pull a second, conflicting binding, PyQt6).
qt = [
    "streamlit-desktop-app>=0.3.3",
    "pywebview[pyside6]; sys_platform != 'darwin'",
    "darkdetect>=0.8.0",
]
# GTK backend (Linux only; macOS uses Cocoa and Windows uses Qt/EdgeChromium).
# pywebview[gtk] installs PyGObject, but a working GTK backend ALSO needs system
# packages pip cannot provide (gobject-introspection, libgirepository and the
# WebKit typelib gir1.2-webkit2-4.x). See the README for the apt prerequisites.
gtk = [
    "streamlit-desktop-app>=0.3.3",
    "pywebview[gtk]; sys_platform == 'linux'",
    "darkdetect>=0.8.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff==0.16.5",
    "mypy==2.3.1",
]

[project.urls]
Homepage = "https://github.com/ralforion/orionbelt-ontology-builder"
Repository = "https://github.com/ralforion/orionbelt-ontology-builder"
Issues = "https://github.com/ralforion/orionbelt-ontology-builder/issues"
Demo = "https://orionbelt.streamlit.app"

[tool.ruff.lint]
# No `select`: we lint against ruff's own default rule set. Up to 0.15.x that
# was just E4/E7/E9/F; 0.16.0 widened it to roughly 35 families (UP, SIM, RUF,
# PERF, PTH, ...) and we adopt that rather than pinning back to the old four.
# Nothing is ignored project-wide. The broad `except Exception` handlers this
# app genuinely needs — resilience boundaries around user-supplied ontologies,
# bulk rows, page dispatch and the pywebview backends — carry an inline
# `# noqa: BLE001` naming the reason, so a *new* blind except still fails CI.

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests" too, so the suite can share helpers (tests/sources.py) rather than
# each file re-deriving where the UI source lives.
pythonpath = [".", "tests"]
filterwarnings = [
    "ignore:ConjunctiveGraph is deprecated:DeprecationWarning:rdflib",
]

[build-system]
# 77 is where PEP 639 (`license` as an SPDX expression, `license-files`) landed.
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The package directory carries the source modules and all bundled data files
# (samples, vis-network bundle, UI assets, favicon). Top-level shim modules
# (`app.py`, `ontology_manager.py`, `templates.py`) are kept as `py-modules`
# for backward compatibility with `streamlit run app.py` and existing test
# imports — they each just re-export from the package.
py-modules = ["app", "ontology_manager", "templates"]
packages = ["orionbelt_ontology_builder"]
include-package-data = true

[tool.setuptools.package-data]
orionbelt_ontology_builder = [
    "favicon.png",
    "assets/*",
    # The graph component only. A "lib/**/*" glob swept in whatever else was in
    # the working tree, including a macOS .DS_Store, and nothing else under lib/
    # is loaded any more.
    "lib/graph_viewer/*",
    # Third-party licence texts for what this wheel redistributes; the map from
    # file to licence is THIRD_PARTY_NOTICES.md at the repo root.
    "licenses/*",
    "samples/**/*.ttl",
    "samples/**/*.owl",
    "samples/**/*.rdf",
    "samples/**/*.txt",
    "samples/**/LICENSE*",
    "samples/README.md",
]
