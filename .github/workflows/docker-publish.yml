name: Docker Publish

# Build and push the OrionBelt Ontology Builder image to Docker Hub, and keep
# the Hub repo overview in sync with README.md.
#
# - changes     → detects whether Docker-relevant files or the README changed,
#                 so the jobs below don't run for unrelated edits.
# - build       → pull requests only, and only when Docker-relevant files
#                 change: builds the image and smoke-tests it, never pushes.
#                 Catches Dockerfile and dependency regressions before a release
#                 tag. Main pushes deliberately do NOT rebuild: a squash-merge of
#                 an up-to-date branch has the same tree the PR just built and
#                 health-checked, so it was building every change twice.
# - image       → only on version tags (v1.2.3): builds each architecture on a
#                 native runner (no QEMU) and pushes it to the Hub by digest.
#                 The two run in parallel, so a release costs one build, not two
#                 in sequence with the arm64 half emulated.
# - manifest    → joins those per-architecture digests into the published tag
#                 list: :1.2.3, :1.2, :1, :latest, carrying each architecture's
#                 provenance attestation across, and fails if either an
#                 architecture or an attestation did not make it.
# - description → on main pushes only when README.md changed, plus manual runs
#                 and releases: syncs README.md to the Docker Hub overview. This
#                 job never builds an image, so no rolling :main / :edge tags.
#
# On caching: these jobs read the layer cache and never write it, which looks
# wrong until you follow the scoping. GitHub scopes its Actions cache to the ref
# that wrote it plus the default branch, and since main stopped building there is
# no ref left whose cache another run can read. A `cache-to` would therefore only
# ever serve a repeat run of the same ref — a second push to an open PR, a re-run
# of a release — and it is not close to worth it: exporting a cold cache took
# 161.8s of a 244s build, against the ~55s of `uv sync` it might save on a push
# that may never come. Dropping the export puts a build at roughly 80s flat.
#
# `cache-from` stays because a read costs nothing and starts paying the moment
# something writes a cache these refs can see. That is the lever if builds ever
# need to be faster: give main a scheduled or post-merge build whose only job is
# to populate the cache, and every PR and release build warms up for free.
#
# Only the image, manifest and description jobs need secrets; build runs without
# them so it works on pull requests from forks:
#   DOCKERHUB_USERNAME — Docker Hub account / org
#   DOCKERHUB_TOKEN    — a Docker Hub access token (Account Settings → Security)
#                        with read/write scope (read-only fails the description sync)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/orionbelt-ontology-builder

jobs:
  # Which parts changed, so build/description can skip unrelated edits. Not run
  # for release tags (image publishes there regardless) or manual runs (which
  # always sync the description); build/description handle those cases directly.
  changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) }}
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      readme: ${{ steps.filter.outputs.readme }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'app.py'
              - 'ontology_manager.py'
              - 'templates.py'
              - 'orionbelt_ontology_builder/**'
              - '.streamlit/**'
              - '.github/workflows/docker-publish.yml'
            readme:
              - 'README.md'

  build:
    needs: changes
    runs-on: ubuntu-latest
    # Pull requests only, and only when Docker-relevant files changed. The image
    # job builds release tags, and the main push after a merge would rebuild the
    # tree the PR already built. always() so it still evaluates when the changes
    # job was skipped (manual runs, where we build unconditionally).
    if: >-
      ${{ always()
      && !startsWith(github.ref, 'refs/tags/v')
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true')) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # linux/amd64 only: it matches the runner, so this needs no QEMU and can
      # load the result for the smoke test. The release build covers both arches.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: orionbelt-ontology-builder:ci
          # Read only, deliberately — see the note at the top of the file.
          cache-from: type=gha,scope=linux-amd64

      # A build that succeeds can still produce an image that never serves, so
      # start it and wait for Streamlit to report healthy.
      - name: Smoke-test image
        run: |
          docker run -d --name ob-ci -p 8501:8501 orionbelt-ontology-builder:ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8501/_stcore/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i}s"
              docker exec ob-ci python -c "import streamlit; print('streamlit', streamlit.__version__)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::/_stcore/health never returned 200"
          docker logs ob-ci
          exit 1

      - name: Clean up
        if: always()
        run: docker rm -f ob-ci || true

  image:
    # Build/push only for released version tags — never for branch or PR pushes.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      # Both arches must publish for the manifest to be complete, but letting the
      # second finish makes a re-run cheap: its cache is already warm.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # linux/amd64 -> linux-amd64, for cache scopes and artifact names (neither
      # accepts a slash).
      - name: Name this platform
        run: echo "PLATFORM_SLUG=${{ matrix.platform }}" | tr / - >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only: they belong to the per-architecture image. The tags are
      # applied once, to the manifest list, by the merge job below.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=OrionBelt Ontology Builder
            org.opencontainers.image.description=A browser-based ontology workbench for building, editing, and managing OWL/SKOS ontologies.

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stated rather than inferred. With attestations on, buildkit wraps
          # each build in an index holding the image manifest plus a provenance
          # manifest, and the digest below is that index -- which is what makes
          # the merge preserve them. build-push-action defaults provenance on
          # for a registry push, but it reads the `push` input to decide, and
          # this step pushes via `outputs` instead, so the default would not
          # necessarily apply. mode=min matches what the published image has
          # carried until now; mode=max would add build arguments and source
          # detail on top.
          provenance: mode=min
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Read only, deliberately — see the note at the top of the file.
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}

      # The digest is all the merge job needs; the layers are already on the Hub.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # One manifest list per tag, pointing at both per-architecture digests.
      # Each of those digests is an index (image + provenance), and imagetools
      # copies the children of a source index rather than flattening it to the
      # image alone, so the attestations survive the merge. That is why this is
      # `imagetools create` and not `docker manifest create`, which drops them.
      - name: Create the manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      # Four entries expected: linux/amd64, linux/arm64, and one unknown/unknown
      # provenance manifest apiece. Fail here rather than ship a tag that
      # silently lost an architecture or its attestations.
      - name: Check what was published
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
          raw=$(docker buildx imagetools inspect --raw "$IMAGE:${{ steps.meta.outputs.version }}")
          for want in linux/amd64 linux/arm64; do
            jq -e --arg p "$want" \
              'any(.manifests[]; "\(.platform.os)/\(.platform.architecture)" == $p)' \
              <<< "$raw" > /dev/null || { echo "::error::$want missing from the manifest list"; exit 1; }
          done
          attestations=$(jq '[.manifests[] | select(.platform.architecture == "unknown")] | length' <<< "$raw")
          [ "$attestations" -eq 2 ] || {
            echo "::error::expected 2 provenance manifests, found $attestations"; exit 1;
          }
          echo "published 2 architectures and $attestations provenance manifests"

  description:
    needs: changes
    runs-on: ubuntu-latest
    # Sync the README to the Hub overview on manual runs and releases, and on
    # main pushes only when README.md actually changed. Independent of the image
    # build — no image is produced here. always() so it still evaluates when the
    # changes job was skipped (manual runs and release tags).
    if: >-
      ${{ always()
      && github.event_name != 'pull_request'
      && (github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/v')
          || needs.changes.outputs.readme == 'true') }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: A browser-based ontology workbench built with Streamlit and rdflib
          readme-filepath: ./README.md
